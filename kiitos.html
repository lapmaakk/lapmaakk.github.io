<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiitos yhteydenotosta — Lapin Maakuntakomppanian Kilta ry</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kiitos-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      padding: 32px;
    }
    .kiitos-box {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .kiitos-icon {
      width: 64px;
      height: 64px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 1.6rem;
      color: var(--gold);
    }
    .kiitos-box h1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      color: #fff;
      margin-bottom: 16px;
    }
    .kiitos-box p {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.75;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <div class="kiitos-wrap">
    <div class="kiitos-box">
      <div class="kiitos-icon">&#10003;</div>
      <h1>Kiitos yhteydenotosta</h1>
      <p>
        Yhteydenottopyyntösi on vastaanotettu. Otamme sinuun yhteyttä
        mahdollisimman pian.
      </p>
      <a href="index.html" class="btn btn-gold">Takaisin etusivulle</a>
    </div>
  </div>
</body>
</html>
